name: Build do Mod (Kits & Ranks)

# Roda automaticamente toda vez que voce enviar (upload/commit) arquivos para o repositorio
on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Descompactar o projeto (caso o zip tenha sido enviado direto)
        run: |
          ZIPFILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -n "$ZIPFILE" ]; then
            echo "Descompactando $ZIPFILE ..."
            unzip -o "$ZIPFILE" -d .
          fi

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Dar permissao de execucao ao gradlew
        run: chmod +x ./gradlew || true

      - name: Gerar o wrapper do Gradle (caso nao exista)
        run: gradle wrapper --gradle-version 8.8

      - name: Compilar o mod
        run: ./gradlew build --no-daemon

      - name: Disponibilizar o .jar para download
        uses: actions/upload-artifact@v4
        with:
          name: kitsmod-jar
          path: build/libs/*.jar
